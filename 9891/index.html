<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nailedit CMS — ניהול תוכן</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    /* =============================================
       CMS Admin — Styles
       ============================================= */
    :root {
      --light:   #fdfbf7;
      --dark:    #1f1f1f;
      --green:   #d9f56a;
      --red:     #e86f5a;
      --blue:    #8ed6ff;
      --white:   #ffffff;
      --gray-1:  #f5f5f5;
      --gray-2:  #e8e8e8;
      --gray-3:  #c0c0c0;
      --sidebar: #1a1a1a;
      --sidebar-hover: #2a2a2a;
      --accent:  #d9f56a;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: 'Noto Sans Hebrew', sans-serif;
      background: var(--gray-1);
      color: var(--dark);
      direction: rtl;
      min-height: 100vh;
    }
    button { cursor: pointer; border: none; background: none; font: inherit; }
    input, textarea, select { font: inherit; }
    a { color: inherit; text-decoration: none; }

    /* ======= LOGIN SCREEN ======= */
    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--dark);
    }
    .login-box {
      background: var(--white);
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .login-logo {
      font-size: 32px;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 8px;
      letter-spacing: -1px;
    }
    .login-subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 36px;
    }
    .login-field {
      width: 100%;
      padding: 14px 18px;
      border: 1.5px solid var(--gray-2);
      border-radius: 12px;
      font-size: 16px;
      color: var(--dark);
      text-align: right;
      direction: rtl;
      margin-bottom: 16px;
      transition: border-color 0.2s;
      outline: none;
      background: var(--light);
    }
    .login-field:focus { border-color: var(--dark); }
    .login-btn {
      width: 100%;
      padding: 14px;
      background: var(--green);
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      color: var(--dark);
      cursor: pointer;
      transition: filter 0.2s;
      margin-top: 4px;
    }
    .login-btn:hover { filter: brightness(0.96); }
    .login-error {
      color: #d32f2f;
      font-size: 14px;
      margin-top: 12px;
      min-height: 20px;
    }

    /* ======= CMS LAYOUT ======= */
    #cms-app { display: none; min-height: 100vh; }
    #cms-app.visible { display: flex; }

    /* Sidebar */
    .sidebar {
      width: 260px;
      min-height: 100vh;
      background: var(--sidebar);
      color: var(--white);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      position: fixed;
      right: 0;
      top: 0;
      bottom: 0;
      z-index: 100;
      overflow-y: auto;
    }
    .sidebar-header {
      padding: 24px 20px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .sidebar-logo { font-size: 22px; font-weight: 700; color: var(--accent); letter-spacing: -1px; }
    .sidebar-badge { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 2px; }
    .sidebar-nav { flex: 1; padding: 12px 0; }
    .sidebar-section-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.3);
      padding: 16px 20px 6px;
    }
    .sidebar-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      cursor: pointer;
      transition: background 0.15s;
      border-radius: 0;
    }
    .sidebar-item:hover { background: var(--sidebar-hover); }
    .sidebar-item.active { background: rgba(217,245,106,0.12); }
    .sidebar-item-label { font-size: 14px; color: rgba(255,255,255,0.8); }
    .sidebar-item.active .sidebar-item-label { color: var(--accent); font-weight: 700; }
    .visibility-toggle {
      width: 32px;
      height: 18px;
      background: rgba(255,255,255,0.15);
      border-radius: 9px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .visibility-toggle.on { background: var(--accent); }
    .visibility-toggle::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      background: white;
      border-radius: 50%;
      top: 2px;
      right: 2px;
      transition: transform 0.2s;
    }
    .visibility-toggle.on::after { transform: translateX(-14px); }

    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sidebar-footer-btn {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.06);
      cursor: pointer;
      text-align: center;
      transition: background 0.15s;
    }
    .sidebar-footer-btn:hover { background: rgba(255,255,255,0.12); }
    .sidebar-footer-btn.danger { color: #ff7070; }
    .sidebar-footer-btn.preview-btn { background: rgba(217,245,106,0.15); color: var(--accent); }

    /* Main content */
    .cms-main {
      flex: 1;
      margin-right: 260px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .cms-topbar {
      background: var(--white);
      border-bottom: 1px solid var(--gray-2);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .cms-topbar h1 { font-size: 18px; font-weight: 700; color: var(--dark); }
    .save-btn {
      padding: 10px 24px;
      background: var(--green);
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      color: var(--dark);
      cursor: pointer;
      transition: filter 0.2s, opacity 0.2s;
    }
    .save-btn:hover { filter: brightness(0.96); }
    .save-btn.saved { background: #e8e8e8; color: #888; }

    .cms-content {
      flex: 1;
      padding: 32px;
    }

    /* Editor panels */
    .editor-panel {
      display: none;
      flex-direction: column;
      gap: 24px;
    }
    .editor-panel.active { display: flex; }
    .panel-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--dark);
      padding-bottom: 4px;
      border-bottom: 2px solid var(--gray-2);
      margin-bottom: 4px;
    }

    /* Field groups */
    .field-group {
      background: var(--white);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .field-group-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--gray-3);
      margin-bottom: 4px;
    }
    .field-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field-label {
      font-size: 13px;
      font-weight: 700;
      color: #555;
    }
    .field-input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--gray-2);
      border-radius: 10px;
      font-size: 15px;
      color: var(--dark);
      text-align: right;
      direction: rtl;
      background: var(--light);
      outline: none;
      transition: border-color 0.2s;
    }
    .field-input:focus { border-color: var(--dark); }
    .field-textarea {
      resize: vertical;
      min-height: 80px;
    }
    .field-img-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .field-img-preview {
      width: 80px;
      height: 60px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--gray-2);
      flex-shrink: 0;
      border: 1px solid var(--gray-2);
    }
    .field-img-col { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .field-hint { font-size: 12px; color: var(--gray-3); }

    /* Image upload zone */
    .upload-zone {
      border: 2px dashed var(--gray-2);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }
    .upload-zone:hover { border-color: var(--dark); background: var(--gray-1); }
    .upload-zone.drag-over { border-color: var(--green); background: rgba(217,245,106,0.1); }
    .upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
    .upload-zone-label { font-size: 14px; color: #888; pointer-events: none; }
    .upload-zone-label span { color: var(--dark); font-weight: 700; }

    /* Section visibility badge */
    .section-hidden-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: #fff3e0;
      color: #e65100;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
    }

    /* Toast notifications */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--dark);
      color: var(--white);
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      z-index: 9999;
      transition: transform 0.3s;
      white-space: nowrap;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* Export modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--white);
      border-radius: 20px;
      padding: 32px;
      width: 90%;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      direction: rtl;
    }
    .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
    .modal-textarea {
      width: 100%;
      min-height: 200px;
      padding: 12px;
      border: 1px solid var(--gray-2);
      border-radius: 10px;
      font-size: 12px;
      font-family: monospace;
      resize: vertical;
      direction: ltr;
      text-align: left;
    }
    .modal-actions { display: flex; gap: 12px; margin-top: 16px; justify-content: flex-end; }
    .modal-btn {
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .modal-btn.primary { background: var(--green); color: var(--dark); }
    .modal-btn.secondary { background: var(--gray-2); color: var(--dark); }

    @media (max-width: 768px) {
      .sidebar { width: 100%; min-height: auto; position: relative; }
      #cms-app { flex-direction: column; }
      .cms-main { margin-right: 0; }
      .cms-topbar { padding: 12px 16px; }
      .cms-content { padding: 16px; }
    }
  </style>
</head>
<body>

<!-- ======= LOGIN SCREEN ======= -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">Nailedit</div>
    <p class="login-subtitle">ניהול תוכן האתר</p>
    <input type="email"    id="login-email"    class="login-field" placeholder="אימייל" autocomplete="email" />
    <input type="password" id="login-password" class="login-field" placeholder="סיסמה" autocomplete="current-password" />
    <button class="login-btn" id="login-btn" onclick="handleLogin()">כניסה</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ======= CMS APP ======= -->
<div id="cms-app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">Nailedit</div>
      <div class="sidebar-badge">ניהול תוכן</div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav">
      <div class="sidebar-section-label">סקשנים</div>
      <!-- Items injected by JS -->
    </nav>
    <div class="sidebar-footer">
      <button class="sidebar-footer-btn preview-btn" onclick="window.open('/', '_blank')">🔗 צפייה באתר</button>
      <button class="sidebar-footer-btn" onclick="openExport()">📤 ייצוא הגדרות</button>
      <button class="sidebar-footer-btn" onclick="openImport()">📥 ייבוא הגדרות</button>
      <button class="sidebar-footer-btn danger" onclick="confirmReset()">↺ איפוס להגדרות ברירת מחדל</button>
      <button class="sidebar-footer-btn" onclick="handleLogout()">יציאה</button>
    </div>
  </aside>

  <!-- Main area -->
  <main class="cms-main">
    <div class="cms-topbar">
      <h1 id="panel-title">ניהול תוכן</h1>
      <button class="save-btn" id="save-btn" onclick="saveAll()">שמור שינויים</button>
    </div>
    <div class="cms-content" id="cms-content">
      <!-- Editor panels injected by JS -->
    </div>
  </main>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Export Modal -->
<div class="modal-overlay" id="export-modal">
  <div class="modal-box">
    <div class="modal-title">ייצוא הגדרות</div>
    <textarea class="modal-textarea" id="export-textarea" readonly></textarea>
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="closeModal('export-modal')">סגור</button>
      <button class="modal-btn primary" onclick="copyExport()">העתק</button>
    </div>
  </div>
</div>

<!-- Import Modal -->
<div class="modal-overlay" id="import-modal">
  <div class="modal-box">
    <div class="modal-title">ייבוא הגדרות</div>
    <p style="font-size:14px;color:#666;margin-bottom:12px;">הדבק JSON שיוצא בעבר:</p>
    <textarea class="modal-textarea" id="import-textarea" placeholder='{"visible":{...},"texts":{...},"images":{...}}'></textarea>
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="closeModal('import-modal')">ביטול</button>
      <button class="modal-btn primary" onclick="doImport()">ייבא</button>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="../js/cms-data.js"></script>
<script>
/* =============================================
   CMS Admin Logic
   ============================================= */

const ADMIN_EMAIL    = 'digital-highlight.com';
const ADMIN_PASSWORD = '9891692';
const AUTH_KEY       = 'nailedit_auth';

/* ---------- Auth ---------- */
function checkAuth() {
  return sessionStorage.getItem(AUTH_KEY) === 'ok';
}

function handleLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-password').value;
  const err   = document.getElementById('login-error');
  if (email === ADMIN_EMAIL && pass === ADMIN_PASSWORD) {
    sessionStorage.setItem(AUTH_KEY, 'ok');
    err.textContent = '';
    showCms();
  } else {
    err.textContent = 'אימייל או סיסמה שגויים.';
    document.getElementById('login-password').value = '';
  }
}

function handleLogout() {
  sessionStorage.removeItem(AUTH_KEY);
  location.reload();
}

document.getElementById('login-email').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('login-password').focus(); });
document.getElementById('login-password').addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

/* ---------- Section Config ---------- */
const SECTIONS = [
  { key: 'hero',       label: 'Hero — גיבור', panelFn: buildHeroPanel },
  { key: 'problems',   label: 'בעיות (3 כרטיסים)', panelFn: buildProblemsPanel },
  { key: 'howItWorks', label: 'איך זה עובד', panelFn: buildHowItWorksPanel },
  { key: 'benefits',   label: 'יתרונות (3 כרטיסים)', panelFn: buildBenefitsPanel },
  { key: 'map',        label: 'מפה / לקוחות', panelFn: buildMapPanel },
  { key: 'faq',        label: 'שאלות נפוצות', panelFn: buildFaqPanel },
  { key: 'signupForm', label: 'טופס הרשמה', panelFn: buildSignupPanel },
];

let currentData = null;
let isDirty = false;

/* ---------- Show CMS ---------- */
function showCms() {
  document.getElementById('login-screen').style.display = 'none';
  const app = document.getElementById('cms-app');
  app.classList.add('visible');

  currentData = window.CmsData.load();
  buildSidebar();
  activatePanel(SECTIONS[0].key);
}

/* ---------- Sidebar ---------- */
function buildSidebar() {
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = '<div class="sidebar-section-label">סקשנים</div>';
  SECTIONS.forEach(s => {
    const item = document.createElement('div');
    item.className = 'sidebar-item';
    item.dataset.key = s.key;
    item.innerHTML = `
      <span class="sidebar-item-label">${s.label}</span>
      <div class="visibility-toggle ${currentData.visible[s.key] !== false ? 'on' : ''}"
           data-vis="${s.key}" title="הצג/הסתר סקשן"></div>
    `;
    item.addEventListener('click', (e) => {
      if (e.target.classList.contains('visibility-toggle')) return;
      activatePanel(s.key);
    });
    item.querySelector('.visibility-toggle').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleVisibility(s.key, item.querySelector('.visibility-toggle'));
    });
    nav.appendChild(item);
  });
}

function activatePanel(key) {
  document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
  const sidebarItem = document.querySelector(`.sidebar-item[data-key="${key}"]`);
  if (sidebarItem) sidebarItem.classList.add('active');

  const section = SECTIONS.find(s => s.key === key);
  if (!section) return;

  document.getElementById('panel-title').textContent = section.label;
  const content = document.getElementById('cms-content');
  content.innerHTML = '';
  const panel = document.createElement('div');
  panel.className = 'editor-panel active';
  section.panelFn(panel, currentData);
  content.appendChild(panel);
}

function toggleVisibility(key, el) {
  const isOn = el.classList.contains('on');
  el.classList.toggle('on', !isOn);
  currentData.visible[key] = !isOn;
  markDirty();
}

/* ---------- Dirty state ---------- */
function markDirty() {
  isDirty = true;
  const btn = document.getElementById('save-btn');
  btn.textContent = 'שמור שינויים*';
  btn.classList.remove('saved');
}

function saveAll() {
  window.CmsData.save(currentData);
  isDirty = false;
  const btn = document.getElementById('save-btn');
  btn.textContent = 'נשמר ✓';
  btn.classList.add('saved');
  setTimeout(() => { btn.textContent = 'שמור שינויים'; btn.classList.remove('saved'); }, 2000);
  showToast('השינויים נשמרו בהצלחה!');
}

/* ---------- Helper: create field ---------- */
function createTextField(label, key, isTextarea = false) {
  const div = document.createElement('div');
  div.className = 'field-row';
  const lbl = document.createElement('label');
  lbl.className = 'field-label';
  lbl.textContent = label;
  const input = document.createElement(isTextarea ? 'textarea' : 'input');
  input.className = 'field-input' + (isTextarea ? ' field-textarea' : '');
  if (!isTextarea) input.type = 'text';
  input.value = window.CmsData.getText(key);
  input.addEventListener('input', () => {
    currentData.texts[key] = input.value;
    markDirty();
  });
  div.appendChild(lbl);
  div.appendChild(input);
  return div;
}

function createImageField(label, key) {
  const div = document.createElement('div');
  div.className = 'field-row';
  const lbl = document.createElement('label');
  lbl.className = 'field-label';
  lbl.textContent = label;

  const row = document.createElement('div');
  row.className = 'field-img-row';

  const preview = document.createElement('img');
  preview.className = 'field-img-preview';
  preview.src = window.CmsData.getImage(key) || '';
  preview.onerror = function() { this.style.opacity = '0.3'; };
  preview.alt = label;

  const col = document.createElement('div');
  col.className = 'field-img-col';

  const urlInput = document.createElement('input');
  urlInput.type = 'url';
  urlInput.className = 'field-input';
  urlInput.placeholder = 'URL של תמונה';
  urlInput.value = window.CmsData.getImage(key) || '';
  urlInput.addEventListener('input', () => {
    currentData.images[key] = urlInput.value;
    preview.src = urlInput.value;
    markDirty();
  });

  const hint = document.createElement('p');
  hint.className = 'field-hint';
  hint.textContent = 'הזן URL לתמונה חיצונית (Cloudinary, Imgur, Drive וכו׳)';

  // File upload
  const uploadZone = document.createElement('div');
  uploadZone.className = 'upload-zone';
  uploadZone.innerHTML = `
    <input type="file" accept="image/*,video/*" />
    <p class="upload-zone-label">גרור תמונה לכאן או <span>לחץ לבחירה</span></p>
  `;
  const fileInput = uploadZone.querySelector('input[type="file"]');
  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      urlInput.value = e.target.result;
      preview.src = e.target.result;
      currentData.images[key] = e.target.result;
      markDirty();
      showToast('תמונה הועלתה (שמורה כ-base64)');
    };
    reader.readAsDataURL(file);
  });
  uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
  uploadZone.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      urlInput.value = ev.target.result;
      preview.src = ev.target.result;
      currentData.images[key] = ev.target.result;
      markDirty();
    };
    reader.readAsDataURL(file);
  });

  col.appendChild(urlInput);
  col.appendChild(hint);
  col.appendChild(uploadZone);

  row.appendChild(preview);
  row.appendChild(col);

  div.appendChild(lbl);
  div.appendChild(row);
  return div;
}

function createVideoField(label, key) {
  const div = document.createElement('div');
  div.className = 'field-row';
  const lbl = document.createElement('label');
  lbl.className = 'field-label';
  lbl.textContent = label;

  const input = document.createElement('input');
  input.type = 'url';
  input.className = 'field-input';
  input.placeholder = 'URL של וידאו (YouTube, Vimeo, MP4...)';
  input.value = (currentData.videos && currentData.videos[key]) || '';
  input.addEventListener('input', () => {
    if (!currentData.videos) currentData.videos = {};
    currentData.videos[key] = input.value;
    markDirty();
  });

  const hint = document.createElement('p');
  hint.className = 'field-hint';
  hint.textContent = 'קישור ישיר לקובץ MP4, YouTube embed, או Vimeo embed';

  div.appendChild(lbl);
  div.appendChild(input);
  div.appendChild(hint);
  return div;
}

function createFieldGroup(title, fields) {
  const group = document.createElement('div');
  group.className = 'field-group';
  if (title) {
    const t = document.createElement('div');
    t.className = 'field-group-title';
    t.textContent = title;
    group.appendChild(t);
  }
  fields.forEach(f => group.appendChild(f));
  return group;
}

function createCardEditor(panel, data, prefix, cardNum, colorLabel) {
  const h = document.createElement('h3');
  h.style.cssText = 'font-size:15px;color:#444;margin-top:4px;';
  h.textContent = `כרטיס ${cardNum} (${colorLabel})`;
  panel.appendChild(h);
  panel.appendChild(createFieldGroup('', [
    createTextField(`כותרת`, `${prefix}.card${cardNum}.title`),
    createTextField(`תיאור`, `${prefix}.card${cardNum}.body`, true),
    createImageField(`תמונה`, `${prefix}.card${cardNum}`),
    createVideoField(`וידאו (אופציונלי)`, `${prefix}.video${cardNum}`),
  ]));
}

/* ---------- Export / Import ---------- */
function openExport() {
  document.getElementById('export-textarea').value = window.CmsData.exportJSON();
  document.getElementById('export-modal').classList.add('open');
}
function openImport() {
  document.getElementById('import-textarea').value = '';
  document.getElementById('import-modal').classList.add('open');
}
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function copyExport() {
  const ta = document.getElementById('export-textarea');
  ta.select();
  document.execCommand('copy');
  showToast('הועתק ללוח!');
}
function doImport() {
  const json = document.getElementById('import-textarea').value.trim();
  if (!json) { showToast('שגיאה: JSON ריק'); return; }
  try {
    window.CmsData.importJSON(json);
    currentData = window.CmsData.get();
    closeModal('import-modal');
    buildSidebar();
    activatePanel(SECTIONS[0].key);
    showToast('ייבוא הצליח!');
  } catch(e) {
    showToast('שגיאה: JSON לא תקין');
  }
}

function confirmReset() {
  if (confirm('האם לאפס את כל ההגדרות לברירת מחדל? פעולה זו לא הפיכה.')) {
    currentData = window.CmsData.reset();
    buildSidebar();
    activatePanel(SECTIONS[0].key);
    showToast('אופס לברירת מחדל');
  }
}

/* ---------- Toast ---------- */
function showToast(msg, duration = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

/* ---------- Close modals on overlay click ---------- */
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.classList.remove('open');
  });
});

/* ---------- Init ---------- */
if (checkAuth()) { showCms(); }
